[project]
name = "hwsets"
version = "0.1.0"
description = "Extract door hardware sets from Division 08 spec PDFs"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11",
    "pypdfium2>=4",
    "anthropic>=0.40",
]

[project.scripts]
hwsets = "hwsets.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hwsets"]
