[project]
name = "hwsets"
version = "0.1.0"
description = "Extract door hardware sets from Division 08 spec PDFs"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11",
    "pypdfium2>=4",
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.32",
]

[project.scripts]
hwsets = "hwsets.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hwsets", "app"]

[dependency-groups]
dev = [
    "playwright>=1.63.0",
]
