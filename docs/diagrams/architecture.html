<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Architecture</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* hand-laid svg, every box and arrow at chosen coordinates. rendered to png by render.sh */
  html, body { margin: 0; background: #f6fbf6; }
  svg { display: block; font-family: Inter, system-ui, sans-serif; }
  .box { fill: #fff; stroke: #e5e7eb; stroke-width: 1.5; }
  .box.green { fill: #f0fdf4; stroke: #16a34a; }
  .box.blue { fill: #eff6ff; stroke: #2563eb; }
  .box.amber { fill: #fffbeb; stroke: #f59e0b; }
  .box.gray { fill: #f9fafb; stroke: #d1d5db; }
  .title { font-size: 19px; font-weight: 600; fill: #111827; }
  .sub { font-size: 13px; fill: #4b5563; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; fill: #374151; }
  .mono.dim { fill: #6b7280; }
  .mono.green { fill: #15803d; }
  .mono.blue { fill: #1d4ed8; }
  .mono.amber { fill: #b45309; }
  .arrow { stroke: #9ca3af; stroke-width: 1.8; fill: none; marker-end: url(#head); }
  .arrow.green { stroke: #16a34a; marker-end: url(#head-green); }
  .arrow.blue { stroke: #2563eb; marker-end: url(#head-blue); stroke-dasharray: 6 5; }
  .arrow.amber { stroke: #f59e0b; marker-end: url(#head-amber); stroke-dasharray: 6 5; }
  .h1 { font-size: 30px; font-weight: 700; fill: #111827; }
  .h2 { font-size: 15px; fill: #4b5563; }
  .tag { font-size: 11px; font-weight: 600; fill: #15803d; letter-spacing: .06em; }
  .pill { fill: #dcfce7; }
  .grid { stroke: rgba(22,101,52,.06); stroke-width: 1; }
  .page { fill: #fff; stroke: #d1d5db; }
  .pagebox { fill: rgba(34,197,94,.12); stroke: #22c55e; stroke-width: 2; }
  .pagetag { fill: #16a34a; }
  .pagetag-t { font-size: 10px; font-weight: 600; fill: #fff; }
  .pagetext { font-family: "JetBrains Mono", monospace; font-size: 11px; fill: #1f2937; }
  .json { font-family: "JetBrains Mono", monospace; font-size: 12px; fill: #1f2937; }
  .json .k { fill: #15803d; }
  .json .v { fill: #1d4ed8; }
  .json .c { fill: #9ca3af; }
</style>
</head>
<body>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#9ca3af"/></marker>
    <marker id="head-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#16a34a"/></marker>
    <marker id="head-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#2563eb"/></marker>
    <pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path class="grid" d="M28 0H0V28" fill="none"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#g)"/>

  <text class="h1" x="60" y="62">One spec per book, plain code for every page</text>
  <text class="h2" x="60" y="90">A model reads two schedule pages once and writes the book's layout. Plain code reads every page with it.</text>

  <!-- row 1: compile the spec -->
  <g>
    <rect class="box" x="60" y="150" width="240" height="96" rx="10"/>
    <text class="title" x="80" y="186">Specbook PDF</text>
    <text class="sub" x="80" y="212">up to 3,930 pages, mostly prose</text>
  </g>
  <path class="arrow" d="M300 198 L350 198"/>
  <g>
    <rect class="box" x="350" y="150" width="240" height="96" rx="10"/>
    <text class="title" x="370" y="186">Page finder</text>
    <text class="sub" x="370" y="212">row-shaped lines, no header wording</text>
    <text class="sub" x="370" y="230">697 set pages of 14,224</text>
  </g>
  <path class="arrow" d="M590 198 L640 198"/>
  <g>
    <rect class="box" x="640" y="150" width="240" height="96" rx="10"/>
    <text class="title" x="660" y="186">2 sample pages</text>
    <text class="sub" x="660" y="212">the densest, as text with x</text>
    <text class="mono dim" x="660" y="232">[80]6 [148]HINGE [464]652</text>
  </g>
  <path class="arrow blue" d="M880 198 L930 198"/>
  <g>
    <rect class="box blue" x="930" y="150" width="240" height="96" rx="10"/>
    <text class="title" x="950" y="186">One model call</text>
    <text class="sub" x="950" y="212">writes the layout spec</text>
    <text class="sub" x="950" y="230">a second one only if the audit flags</text>
  </g>
  <path class="arrow green" d="M1170 198 L1220 198"/>
  <g>
    <rect class="box green" x="1220" y="150" width="320" height="96" rx="10"/>
    <text class="title" x="1240" y="186">Layout spec</text>
    <text class="mono green" x="1240" y="210">header pattern, column x per field,</text>
    <text class="mono green" x="1240" y="228">wrap style   cached in specs/</text>
  </g>

  <!-- the spec feeds every page -->
  <path class="arrow green" d="M1380 246 L1380 290 L180 290 L180 340"/>
  <text class="mono green" x="200" y="284">every page</text>

  <!-- row 2: read the book -->
  <g>
    <rect class="box" x="60" y="340" width="300" height="96" rx="10"/>
    <text class="title" x="80" y="376">Interpreter</text>
    <text class="sub" x="80" y="402">columns by x, wraps joined, a box per row</text>
    <text class="sub" x="80" y="420">deterministic, 0.1 s a page</text>
  </g>
  <path class="arrow" d="M360 388 L410 388"/>
  <g>
    <rect class="box amber" x="410" y="340" width="280" height="96" rx="10"/>
    <text class="title" x="430" y="376">Audit</text>
    <text class="sub" x="430" y="402">seven checks against the raw text</text>
    <text class="sub" x="430" y="420">flags trigger the one repair call</text>
  </g>
  <path class="arrow" d="M690 388 L740 388"/>
  <g>
    <rect class="box green" x="740" y="340" width="320" height="96" rx="10"/>
    <text class="title" x="760" y="376">JSON per book</text>
    <text class="sub" x="760" y="402">sets and rows, each with a page and a box,</text>
    <text class="sub" x="760" y="420">a confidence per field, legend names</text>
  </g>
  <path class="arrow" d="M1060 388 L1110 388"/>
  <g>
    <rect class="box" x="1110" y="340" width="430" height="96" rx="10"/>
    <text class="title" x="1130" y="376">Viewer</text>
    <text class="sub" x="1130" y="402">the page with a box per set beside its rows</text>
    <text class="sub" x="1130" y="420">fix a mistake once, the whole book reruns</text>
  </g>
  <!-- fixes go back into the spec -->
  <path class="arrow green" d="M1540 388 L1570 388 L1570 198 L1546 198"/>
  <text class="mono green" x="1130" y="466">drag a column line, tag a line, or say what is wrong</text>

  <!-- what comes out, for one row -->
  <text class="tag" x="60" y="530">WHAT COMES OUT, FOR ONE ROW</text>
  <rect class="page" x="60" y="545" width="640" height="230" rx="6"/>
  <text class="pagetext" xml:space="preserve" x="84" y="578">HARDWARE GROUP NO. 18</text>
  <text class="pagetext" xml:space="preserve" x="84" y="596">E120A  E121B</text>
  <text class="pagetext" xml:space="preserve" x="84" y="614">PROVIDE EACH PR DOOR(S) WITH THE FOLLOWING:</text>
  <text class="pagetext" xml:space="preserve" x="84" y="636">QTY   DESCRIPTION      CATALOG NUMBER                FINISH  MFR</text>
  <rect class="pagebox" x="76" y="648" width="600" height="38" rx="3"/>
  <text class="pagetext" xml:space="preserve" x="84" y="666">6     EA  HINGE        5BB1HW 4.5 X 4.5 - NRP AT     652     IVE</text>
  <text class="pagetext" xml:space="preserve" x="84" y="682">                       OUTSWINGING DRS</text>
  <text class="pagetext" xml:space="preserve" x="84" y="710">1     EA  CLOSER       4040XP                        689     LCN</text>
  <text class="pagetext" xml:space="preserve" x="84" y="728">1     EA  KICK PLATE   8400 10" X 2" LDW             630     IVE</text>
  <text class="mono dim" x="84" y="760">Oswego, page 428</text>

  <path class="arrow green" d="M710 660 L760 660"/>

  <rect class="page" x="770" y="545" width="770" height="230" rx="6"/>
  <text class="json" x="794" y="578">{</text>
  <text class="json" x="794" y="600">  <tspan class="k">"qty"</tspan>: <tspan class="v">6</tspan>, <tspan class="k">"description"</tspan>: <tspan class="v">"HINGE"</tspan>,</text>
  <text class="json" x="794" y="622">  <tspan class="k">"catalog_number"</tspan>: <tspan class="v">"5BB1HW 4.5 X 4.5 - NRP AT OUTSWINGING DRS"</tspan>,</text>
  <text class="json" x="794" y="644">  <tspan class="k">"finish"</tspan>: <tspan class="v">"652"</tspan>, <tspan class="k">"mfr"</tspan>: <tspan class="v">"IVE"</tspan>, <tspan class="k">"notes"</tspan>: <tspan class="v">null</tspan>,</text>
  <text class="json" x="794" y="666">  <tspan class="k">"page"</tspan>: <tspan class="v">428</tspan>, <tspan class="k">"bbox"</tspan>: [<tspan class="v">80.1</tspan>, <tspan class="v">98.2</tspan>, <tspan class="v">528.0</tspan>, <tspan class="v">121.7</tspan>],</text>
  <text class="json" x="794" y="688">  <tspan class="k">"confidence"</tspan>: {<tspan class="k">"qty"</tspan>: <tspan class="v">1.0</tspan>, <tspan class="k">"catalog_number"</tspan>: <tspan class="v">0.9</tspan>, <tspan class="k">"mfr"</tspan>: <tspan class="v">1.0</tspan>, ...},</text>
  <text class="json" x="794" y="710">  <tspan class="k">"mfr_name"</tspan>: <tspan class="v">null</tspan>, <tspan class="k">"finish_name"</tspan>: <tspan class="v">null</tspan>  <tspan class="c">// set when the book prints a legend</tspan></text>
  <text class="json" x="794" y="732">}</text>

  <text class="mono" x="60" y="830">155 labeled pages, every field exact: 98.5% of rows, 94.9% of sets fully correct. Held out: 97.2% of rows. 1,174 of 1,175 printed set numbers found.</text>
</svg>
</body>
</html>
